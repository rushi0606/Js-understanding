<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Image Event Listener</title>
</head>
<body>
    <h1>Images</h1>
  <img id="myImage" src="https://via.placeholder.com/150" alt="sample image">
  <br>
  <a 
      href="https://www.google.com/search?q=HTML+tutorial" 
      target="_blank" id="google"
    >
    Google
    </a>
<script>
    // document.getElementById('myImage').onclick = function(){
    //     alert("Image Clicked!")
    // }

    const img = document.getElementById("myImage");
    img.addEventListener("click", function (e) {
        console.log(e);
        alert("Image clicked!");
    });   //right way

    document.getElementById('google').addEventListener('click', function(e){
        e.preventDefault()
        e.stopPropagation()
        console.log("google clicked");    
    })

    document.getElementById('myImage').addEventListener('click', function(e){
        console.log(e.target.parentNode);
        let removeIt = e.target.parentNode
        // removeIt.remove()
        // removeIt.parentNode.removeChild(removeIt)  //remove img as well as google link
    })

    document.getElementById('myImage').addEventListener('click', function(e){
        console.log(e.target.tagName); 

        if(e.target.tagName === 'IMG'){
            e.target.remove()  //removes only image
        }
    })    
</script>

</body> 
</html>
